version: '3.8'

services:
  nginx-lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sync-api-1
      - sync-api-2

  sync-api-1:
    build: .
    environment:
      - NODE_ID=api-node-1
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://syncuser:syncpass@postgres:5432/syncdb
    depends_on:
      - redis
      - postgres

  sync-api-2:
    build: .
    environment:
      - NODE_ID=api-node-2
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://syncuser:syncpass@postgres:5432/syncdb
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=syncuser
      - POSTGRES_PASSWORD=syncpass
      - POSTGRES_DB=syncdb
    ports:
      - "5432:5432"
